AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 170

Metrics/ParameterLists:
  Max: 6

Metrics/AbcSize:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# set_default_provider / set_default_source are CLI verbs, not writer accessors.
Naming/AccessorMethodName:
  Enabled: false
