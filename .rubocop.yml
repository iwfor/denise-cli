AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 22

Metrics/ClassLength:
  Max: 220

Metrics/ParameterLists:
  Max: 6

Metrics/AbcSize:
  Max: 23

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# set_default_provider / set_default_source are CLI verbs, not writer accessors.
Naming/AccessorMethodName:
  Enabled: false

# Methods like ensure_file! deliberately use the bang (side-effecting/may
# create something) rather than a `?` suffix, even though they also return
# a boolean for the caller's convenience - matches Crypto#ensure_key!.
Naming/PredicateMethod:
  Enabled: false
